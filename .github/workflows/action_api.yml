name: Generate Catalog YAML and Open PR if Changed
concurrency:
  group: catalog-${{ github.repository }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - '**/*.tf'
      - 'resource.yml'
      - '.github/workflows/scripts/generate_catalog.sh'

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure generator script exists
        run: |
          if [[ ! -f ".github/workflows/scripts/generate_catalog.sh" ]]; then
            echo "ERRO: generate_catalog.sh não encontrado no repo." >&2
            exit 1
          fi
          chmod +x .github/workflows/scripts/generate_catalog.sh

      - name: Generate Catalog YAML (Source Repo)
        env:
          # ➜ API do catálogo (obrigatório)
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          # ➜ Token opcional para Authorization: Bearer <token>
          CATALOG_API_TOKEN: ${{ secrets.CATALOG_API_TOKEN }}
          # (opcionais) Timeout e TLS
          CATALOG_TIMEOUT: "25"
          CATALOG_INSECURE: "0"
          # Debug do matching (0/1)
          DEBUG_MATCH: "0"
        run: |
          ./.github/workflows/scripts/generate_catalog.sh

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: rafaveloso23/repo-destino-rvs-modules
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          path: target-repo

      - name: Copy Catalog File to Target Repository
        run: |
          DEST_DIR="target-repo/biblioteca/${COSTCENTER}"
          mkdir -p "$DEST_DIR"
          cp "biblioteca/${COSTCENTER}/${OUTPUT_FILE}" "$DEST_DIR/${OUTPUT_FILE}"

      - name: Check for Changes in Target Repo
        id: diffcheck
        working-directory: target-repo
        run: |
          git add .
          if git diff --cached --quiet --exit-code .; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Open PR in Target Repo
        if: steps.diffcheck.outputs.no_changes == 'false'
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="feature/${COSTCENTER}-${MODULE_NAME}-update-${RANDOM}"
          git checkout -b "$BRANCH_NAME"
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: atualizando recurso ${MODULE_NAME} do centro de custo ${COSTCENTER}" || echo "No changes to commit"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --repo rafaveloso23/repo-destino-rvs-modules \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Update ${MODULE_NAME} Catalog" \
            --body "Automated Catalog update for ${MODULE_NAME}"

      - name: Show Terraform Variables in Summary (No Changes)
        if: steps.diffcheck.outputs.no_changes == 'true'
        run: |
          echo "## 📋 Terraform Inputs" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.inputs }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.outputs }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Depends On" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.depends_on }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

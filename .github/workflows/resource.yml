name: Generate Catalog YAML and Open PR if Changed

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.tf'
      - 'resource.yml'

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Catalog YAML (Source Repo)
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          COSTCENTER=$(echo $REPO_NAME | awk -F'-' '{print $3}')
          MODULE_NAME=$(echo $REPO_NAME | cut -d'-' -f4-)

          OUTPUT_FILE="${REPO_NAME}.yml"

          mkdir -p biblioteca/$COSTCENTER

          # Coletar inputs e outputs do Terraform
          inputs=()
          outputs=()

          while IFS= read -r line; do
              var_name=$(echo "$line" | sed -n 's/variable[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$var_name" ]]; then
                  inputs+=("$var_name")
              fi
          done < <(grep -rEh '^variable[[:space:]]+"[^"]+"' . --include="*.tf")

          while IFS= read -r line; do
              output_name=$(echo "$line" | sed -n 's/output[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$output_name" ]]; then
                  outputs+=("$output_name")
              fi
          done < <(grep -rEh '^output[[:space:]]+"[^"]+"' . --include="*.tf")

          # Formatar inputs/outputs em YAML
          inputs_yaml=""
          for input in "${inputs[@]}"; do
              inputs_yaml+="      - $input"$'\n'
          done

          outputs_yaml=""
          for output in "${outputs[@]}"; do
              outputs_yaml+="      - $output"$'\n'
          done

          # Preencher o template resource.yml
          sed -e "s|\${MODULE_NAME}|$REPO_NAME|g" \
              -e "s|\${MODULE_DESCRIPTION}|Módulo no-code para criação de \"$REPO_NAME\"|g" \
              resource.yml > temp_resource.yml

          awk -v inputs="$inputs_yaml" -v outputs="$outputs_yaml" '
          {
              if ($0 ~ /\${INPUTS_PLACEHOLDER}/) {
                  print inputs
              } else if ($0 ~ /\${OUTPUTS_PLACEHOLDER}/) {
                  print outputs
              } else {
                  print $0
              }
          }' temp_resource.yml > "biblioteca/$COSTCENTER/$OUTPUT_FILE"

          rm temp_resource.yml

          # Salvando outputs para o próximo step
          echo "inputs=${inputs[*]}" >> $GITHUB_ENV
          echo "outputs=${outputs[*]}" >> $GITHUB_ENV
          echo "COSTCENTER=$COSTCENTER" >> $GITHUB_ENV
          echo "MODULE_NAME=$MODULE_NAME" >> $GITHUB_ENV
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: rafaveloso23/repo-destino-rvs-modules
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          path: target-repo

      - name: Copy Catalog File to Target Repository
        run: |
          DEST_DIR="target-repo/catalog/${COSTCENTER}/${MODULE_NAME}"
          mkdir -p "$DEST_DIR"
          cp "biblioteca/$COSTCENTER/$OUTPUT_FILE" "$DEST_DIR/${OUTPUT_FILE}"

      - name: Check for Changes in Target Repo
        id: diffcheck
        working-directory: target-repo
        run: |
          git add .
          if git diff --cached --quiet --exit-code .; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Open PR in Target Repo
        if: steps.diffcheck.outputs.no_changes == 'false'
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="feature/${COSTCENTER}-${MODULE_NAME}-update-${RANDOM}"
          git checkout -b $BRANCH_NAME
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: atualizando recurso ${MODULE_NAME} do centro de custo ${COSTCENTER}" || echo "No changes to commit"
          git push origin $BRANCH_NAME

          gh pr create \
            --repo rafaveloso23/repo-destino-rvs-modules \
            --base main \
            --head $BRANCH_NAME \
            --title "Update ${MODULE_NAME} Catalog" \
            --body "Automated Catalog update for ${MODULE_NAME}"

      - name: Show Terraform Variables in Summary (No Changes)
        if: steps.diffcheck.outputs.no_changes == 'true'
        run: |
          echo "## 📋 Terraform Inputs" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.inputs }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.outputs }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

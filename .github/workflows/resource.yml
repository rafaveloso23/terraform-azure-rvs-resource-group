name: Generate Catalog YAML and Open PR if Changed

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.tf'
      - 'resource.yml'

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Catalog YAML
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          COSTCENTER=$(echo $REPO_NAME | awk -F'-' '{print $3}')
          OUTPUT_FILE="${REPO_NAME}.yml"

          mkdir -p arquivo/$COSTCENTER

          # Coletar inputs e outputs do Terraform
          inputs=()
          outputs=()

          while IFS= read -r line; do
              var_name=$(echo "$line" | sed -n 's/variable[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$var_name" ]]; then
                  inputs+=("$var_name")
              fi
          done < <(grep -rEh '^variable[[:space:]]+"[^"]+"' . --include="*.tf")

          while IFS= read -r line; do
              output_name=$(echo "$line" | sed -n 's/output[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$output_name" ]]; then
                  outputs+=("$output_name")
              fi
          done < <(grep -rEh '^output[[:space:]]+"[^"]+"' . --include="*.tf")

          # Formatar inputs/outputs em YAML
          inputs_yaml=""
          for input in "${inputs[@]}"; do
              inputs_yaml+="      - $input"$'\n'
          done

          outputs_yaml=""
          for output in "${outputs[@]}"; do
              outputs_yaml+="      - $output"$'\n'
          done

          # Preencher o template resource.yml
          sed -e "s|\${MODULE_NAME}|$REPO_NAME|g" \
              -e "s|\${MODULE_DESCRIPTION}|Módulo no-code para criação de \"$REPO_NAME\"|g" \
              resource.yml > temp_resource.yml

          awk -v inputs="$inputs_yaml" -v outputs="$outputs_yaml" '
          {
              if ($0 ~ /\${INPUTS_PLACEHOLDER}/) {
                  print inputs
              } else if ($0 ~ /\${OUTPUTS_PLACEHOLDER}/) {
                  print outputs
              } else {
                  print $0
              }
          }' temp_resource.yml > "arquivo/$COSTCENTER/$OUTPUT_FILE"

          rm temp_resource.yml

          echo "COSTCENTER=$COSTCENTER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Clone Target Repository
        uses: actions/checkout@v4
        with:
          repository: rafaveloso23/repo-destino-rvs-modules
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target-repo

      - name: Copy Catalog File to Target Repository Folder
        run: |
          DEST_DIR="target-repo/bibliote/$COSTCENTER"
          mkdir -p "$DEST_DIR"

          cp "arquivo/$COSTCENTER/$OUTPUT_FILE" "$DEST_DIR/$OUTPUT_FILE"

      - name: Check for Changes in Target Repo
        id: diffcheck
        working-directory: target-repo
        run: |
          if git diff --quiet --exit-code .; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes to Target Repo
        if: steps.diffcheck.outputs.no_changes == 'false'
        working-directory: target-repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="catalog-update-${REPO_NAME}-$(date +%s)"
          git checkout -b $BRANCH_NAME

          git add .
          git commit -m "chore: update catalog YAML for $REPO_NAME"
          git push origin $BRANCH_NAME

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request on Target Repo
        if: steps.diffcheck.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: rafaveloso23/repo-destino-rvs-modules
          commit-message: "chore: update catalog YAML for ${{ env.REPO_NAME }}"
          branch: ${{ env.branch_name }}
          title: "Catalog Update for ${{ env.REPO_NAME }}"
          body: "Automated update for catalog YAML of module ${{ env.REPO_NAME }}."

      - name: Show Terraform Variables in Summary (No Changes)
        if: steps.diffcheck.outputs.no_changes == 'true'
        run: |
          echo "## 📋 Terraform Inputs" >> $GITHUB_STEP_SUMMARY
          echo "${inputs[@]}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "${outputs[@]}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

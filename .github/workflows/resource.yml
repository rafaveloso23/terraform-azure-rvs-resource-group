name: Generate Catalog YAML into /arquivo/<costcenter>

on:
  pull_request:
    paths:
      - '**/*.tf'
      - 'resource.yml'

jobs:
  generate-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Catalog YAML and Move to Costcenter Folder
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          
          # Extrair centro de custo do nome do repositório (terceira parte após split '-')
          COSTCENTER=$(echo $REPO_NAME | awk -F'-' '{print $3}')

          OUTPUT_FILE="${REPO_NAME}.yml"
          DEST_DIR="arquivo/${COSTCENTER}"

          echo "Repo: $REPO_NAME"
          echo "Centro de Custo: $COSTCENTER"
          echo "Arquivo final será movido para: $DEST_DIR/"

          # Coletar inputs e outputs do Terraform
          inputs=()
          outputs=()

          while IFS= read -r line; do
              var_name=$(echo "$line" | sed -n 's/variable[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$var_name" ]]; then
                  inputs+=("$var_name")
              fi
          done < <(grep -rEh '^variable[[:space:]]+"[^"]+"' . --include="*.tf")

          while IFS= read -r line; do
              output_name=$(echo "$line" | sed -n 's/output[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$output_name" ]]; then
                  outputs+=("$output_name")
              fi
          done < <(grep -rEh '^output[[:space:]]+"[^"]+"' . --include="*.tf")

          # Formatar inputs e outputs em YAML
          inputs_yaml=""
          for input in "${inputs[@]}"; do
              inputs_yaml+="      - $input"$'\n'
          done

          outputs_yaml=""
          for output in "${outputs[@]}"; do
              outputs_yaml+="      - $output"$'\n'
          done

          # Preencher o template resource.yml
          sed -e "s|\${MODULE_NAME}|$REPO_NAME|g" \
              -e "s|\${MODULE_DESCRIPTION}|Módulo no-code para criação de \"$REPO_NAME\"|g" \
              resource.yml > temp_resource.yml

          # Inserir inputs e outputs no arquivo final
          awk -v inputs="$inputs_yaml" -v outputs="$outputs_yaml" '
          {
              if ($0 ~ /\${INPUTS_PLACEHOLDER}/) {
                  print inputs
              } else if ($0 ~ /\${OUTPUTS_PLACEHOLDER}/) {
                  print outputs
              } else {
                  print $0
              }
          }' temp_resource.yml > "$OUTPUT_FILE"

          rm temp_resource.yml

          echo "Arquivo $OUTPUT_FILE gerado com sucesso!"

          # Criar diretório /arquivo/<costcenter>/ se não existir
          mkdir -p "$DEST_DIR"

          # Mover o arquivo gerado para o diretório destino
          mv "$OUTPUT_FILE" "$DEST_DIR/"

      - name: Commit and Push to PR Branch
        run: |
          git fetch origin $GITHUB_HEAD_REF
          git checkout $GITHUB_HEAD_REF

          if [[ `git status --porcelain arquivo/` ]]; then
            git add arquivo/
            git commit -m "chore: generated catalog yaml in dynamic costcenter folder"
            git push origin $GITHUB_HEAD_REF
          else
            echo "No changes to commit."
          fi

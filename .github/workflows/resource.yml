name: Generate Catalog YAML and Open PR if Changed

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*.tf'
      - 'resource.yml'

jobs:
  generate-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Catalog YAML
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          COSTCENTER=$(echo $REPO_NAME | awk -F'-' '{print $3}')
          OUTPUT_FILE="${REPO_NAME}.yml"
          DEST_DIR="arquivo/${COSTCENTER}"

          mkdir -p "$DEST_DIR"

          # Coletar inputs e outputs do Terraform
          inputs=()
          outputs=()

          while IFS= read -r line; do
              var_name=$(echo "$line" | sed -n 's/variable[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$var_name" ]]; then
                  inputs+=("$var_name")
              fi
          done < <(grep -rEh '^variable[[:space:]]+"[^"]+"' . --include="*.tf")

          while IFS= read -r line; do
              output_name=$(echo "$line" | sed -n 's/output[[:space:]]*"\([^"]*\)".*/\1/p')
              if [[ ! -z "$output_name" ]]; then
                  outputs+=("$output_name")
              fi
          done < <(grep -rEh '^output[[:space:]]+"[^"]+"' . --include="*.tf")

          # Formatar inputs/outputs em YAML
          inputs_yaml=""
          for input in "${inputs[@]}"; do
              inputs_yaml+="      - $input"$'\n'
          done

          outputs_yaml=""
          for output in "${outputs[@]}"; do
              outputs_yaml+="      - $output"$'\n'
          done

          # Preencher o template resource.yml
          sed -e "s|\${MODULE_NAME}|$REPO_NAME|g" \
              -e "s|\${MODULE_DESCRIPTION}|Módulo no-code para criação de \"$REPO_NAME\"|g" \
              resource.yml > temp_resource.yml

          awk -v inputs="$inputs_yaml" -v outputs="$outputs_yaml" '
          {
              if ($0 ~ /\${INPUTS_PLACEHOLDER}/) {
                  print inputs
              } else if ($0 ~ /\${OUTPUTS_PLACEHOLDER}/) {
                  print outputs
              } else {
                  print $0
              }
          }' temp_resource.yml > "$DEST_DIR/$OUTPUT_FILE"

          rm temp_resource.yml

          echo "Arquivo gerado em: $DEST_DIR/$OUTPUT_FILE"

      - name: Check for Changes in Catalog File
        id: diffcheck
        run: |
          if git diff --quiet --exit-code arquivo/; then
            echo "no_changes=true" >> $GITHUB_ENV
          else
            echo "no_changes=false" >> $GITHUB_ENV
          fi

      - name: Create Branch and Commit Changes
        if: env.no_changes == 'false'
        run: |
          BRANCH_NAME="auto/catalog-update-$(date +%s)"

          git checkout -b $BRANCH_NAME
          git add arquivo/
          git commit -m "chore: update catalog YAML for $REPO_NAME"
          git push origin $BRANCH_NAME

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.no_changes == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update catalog YAML for ${{ env.REPO_NAME }}"
          branch: ${{ env.branch_name }}
          title: "Catalog Update for ${{ env.REPO_NAME }}"
          body: "This PR updates the catalog YAML definition based on the latest Terraform inputs/outputs."
